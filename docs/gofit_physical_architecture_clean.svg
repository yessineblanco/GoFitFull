<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GoFit Physical Architecture - Clean Slide Version</title>
  <desc id="desc">Clean deployment architecture for the GoFit mobile app, admin panel, Supabase backend, and external services.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 42px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Arial, sans-serif; fill: #475569; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 26; filter: url(#shadow); }
      .zone-title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .node-title { font: 700 19px Arial, sans-serif; fill: #111827; }
      .node-text { font: 400 15px Arial, sans-serif; fill: #475569; }
      .label { font: 700 15px Arial, sans-serif; fill: #1d4ed8; }
      .label-green { font: 700 15px Arial, sans-serif; fill: #047857; }
      .small { font: 400 14px Arial, sans-serif; fill: #64748b; }
      .blue-node { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; rx: 18; }
      .green-node { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; rx: 18; }
      .purple-node { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 2; rx: 18; }
      .orange-node { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 18; }
      .gray-node { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 18; }
      .arrow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrowBlue); }
      .arrow-green { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrowGreen); }
      .arrow-dashed { stroke: #2563eb; stroke-width: 3; fill: none; stroke-dasharray: 9 7; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="80" y="72">GoFit Physical Architecture</text>
  <text class="subtitle" x="80" y="108">Deployment view: devices, web admin, Supabase cloud, and external services</text>

  <!-- Mobile zone -->
  <rect class="zone" x="70" y="170" width="360" height="265"/>
  <text class="zone-title" x="105" y="215">Mobile Device</text>
  <rect class="blue-node" x="105" y="245" width="290" height="90"/>
  <text class="node-title" x="130" y="280">GoFitMobile</text>
  <text class="node-text" x="130" y="305">Expo / React Native</text>
  <text class="node-text" x="130" y="328">iOS + Android</text>
  <rect class="gray-node" x="105" y="355" width="290" height="55"/>
  <text class="node-title" x="130" y="388">SecureStore sessions</text>

  <!-- Admin zone -->
  <rect class="zone" x="70" y="520" width="360" height="235"/>
  <text class="zone-title" x="105" y="565">Admin Workstation</text>
  <rect class="purple-node" x="105" y="595" width="290" height="60"/>
  <text class="node-title" x="130" y="632">Web browser</text>
  <rect class="gray-node" x="105" y="675" width="290" height="60"/>
  <text class="node-title" x="130" y="710">Next.js admin panel</text>

  <!-- Supabase zone -->
  <rect class="zone" x="600" y="170" width="430" height="585"/>
  <text class="zone-title" x="635" y="215">Supabase Cloud</text>
  <rect class="green-node" x="650" y="250" width="330" height="70"/>
  <text class="node-title" x="680" y="285">Supabase Auth</text>
  <text class="node-text" x="680" y="308">accounts and sessions</text>
  <rect class="green-node" x="650" y="350" width="330" height="90"/>
  <text class="node-title" x="680" y="385">PostgreSQL Database</text>
  <text class="node-text" x="680" y="408">workouts, sessions, profiles</text>
  <text class="node-text" x="680" y="431">Row Level Security</text>
  <rect class="green-node" x="650" y="470" width="330" height="75"/>
  <text class="node-title" x="680" y="505">Supabase Storage</text>
  <text class="node-text" x="680" y="528">exercise media and files</text>
  <rect class="green-node" x="650" y="580" width="330" height="90"/>
  <text class="node-title" x="680" y="615">Edge Functions</text>
  <text class="node-text" x="680" y="638">push notifications</text>
  <text class="node-text" x="680" y="661">video call tokens</text>

  <!-- External services zone -->
  <rect class="zone" x="1190" y="170" width="340" height="585"/>
  <text class="zone-title" x="1225" y="215">External Services</text>
  <rect class="orange-node" x="1230" y="255" width="260" height="80"/>
  <text class="node-title" x="1255" y="290">Expo Push Service</text>
  <text class="node-text" x="1255" y="314">FCM / APNs delivery</text>
  <rect class="orange-node" x="1230" y="410" width="260" height="80"/>
  <text class="node-title" x="1255" y="445">LiveKit</text>
  <text class="node-text" x="1255" y="469">video calls</text>
  <rect class="orange-node" x="1230" y="565" width="260" height="80"/>
  <text class="node-title" x="1255" y="600">Cloudflare R2</text>
  <text class="node-text" x="1255" y="624">optional media storage</text>

  <!-- Clean high-level connections -->
  <path class="arrow" d="M 395 290 C 500 290, 520 375, 650 395"/>
  <text class="label" x="455" y="325">HTTPS / Supabase SDK</text>

  <path class="arrow-green" d="M 250 335 L 250 355"/>
  <text class="label-green" x="270" y="352">local session</text>

  <path class="arrow" d="M 395 705 C 510 705, 530 505, 650 505"/>
  <text class="label" x="455" y="665">Admin CRUD + media</text>

  <path class="arrow" d="M 980 625 C 1085 625, 1120 300, 1230 295"/>
  <text class="label" x="1050" y="455">send reminders</text>

  <path class="arrow" d="M 980 630 C 1100 630, 1120 455, 1230 450"/>
  <text class="label" x="1055" y="585">video token</text>

  <path class="arrow-dashed" d="M 395 705 C 685 820, 1010 650, 1230 605"/>
  <text class="label" x="745" y="795">optional uploads</text>

  <rect x="80" y="810" width="1440" height="55" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="small" x="115" y="843">Legend: solid arrows = runtime API communication, dashed arrow = optional external storage flow, green arrow = secure local session storage.</text>
</svg>
